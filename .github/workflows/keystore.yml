name: Buat keystore debug

# Jalankan sekali. Hasilnya muncul di ringkasan job: sidik jari untuk Firebase dan
# teks TERENKRIPSI untuk secret DEBUG_KEYSTORE_ENC. Keystore polos tidak pernah
# dicetak, karena ringkasan job bisa dibaca siapa saja kalau repo ini publik.
#
# Sebelum menjalankan: buat secret KEYSTORE_PASSPHRASE berisi teks acak minimal 24
# karakter (Settings, Secrets and variables, Actions). Simpan juga di tempat aman;
# tanpa itu DEBUG_KEYSTORE_ENC tidak bisa dibuka lagi. Ini kunci debug (kata sandi
# dalam keystore "android"), bukan kunci rilis Play Store.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Buat keystore, enkripsi, dan tampilkan sidik jarinya
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ "${#KEYSTORE_PASSPHRASE}" -lt 24 ]; then
            echo "::error::Isi secret KEYSTORE_PASSPHRASE dengan teks acak minimal 24 karakter lebih dulu."
            exit 1
          fi
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          encrypted="$(openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:KEYSTORE_PASSPHRASE -in debug.keystore -base64 -A)"
          {
            echo "## Keystore debug QELVO"
            echo
            echo "Tambahkan dua sidik jari ini di Firebase Console (Project settings, aplikasi Android, Add fingerprint). Hapus sidik jari lama yang sudah tidak dipakai:"
            echo '```'
            keytool -list -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android | grep -E 'SHA1|SHA256'
            echo '```'
            echo
            echo "Salin teks terenkripsi ini ke secret repo bernama DEBUG_KEYSTORE_ENC. Teks ini aman dibaca orang lain tanpa KEYSTORE_PASSPHRASE:"
            echo '```'
            echo "$encrypted"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
