name: Build APK

# Jalankan dari tab Actions (tombol "Run workflow"), atau dorong tag v*,
# misalnya v0.1.0. Sengaja tidak jalan di tiap push supaya menit Actions
# tidak terbuang.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Arsitektur HP: universal untuk semua HP, arm64 lebih kecil"
        type: choice
        options:
          - universal
          - arm64
        default: universal
      release:
        description: "Buat GitHub Release supaya APK mudah diunduh dari HP"
        type: boolean
        default: true
      flutter_version:
        description: "Versi Flutter. Kosongkan untuk stabil terbaru (contoh: 3.35.0)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Tiap nilai boleh disimpan sebagai Variable atau Secret. Daftar lengkap: docs/ENV.md
env:
  QELVO_API_URL: ${{ vars.QELVO_API_URL || secrets.QELVO_API_URL }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID || secrets.FIREBASE_SENDER_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
  EMAIL_LOGIN: ${{ vars.EMAIL_LOGIN || secrets.EMAIL_LOGIN }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Proyek harus ada di app/. Kalau tidak (terunggah di dalam folder lain,
      # atau masih berupa .zip), cari lalu pindahkan ke app/ di runner.
      - name: Cari folder proyek
        working-directory: .
        run: |
          [ -f app/pubspec.yaml ] && exit 0
          find_project() {
            local f
            while IFS= read -r f; do
              if grep -q '^name: qelvo_ai' "$f"; then dirname "$f"; return 0; fi
            done < <(find "$1" -maxdepth 5 -name pubspec.yaml -not -path '*/.git/*' | awk '{ print length($0) " " $0 }' | sort -n | cut -d' ' -f2-)
            return 1
          }
          zip=""
          dir=$(find_project .) || dir=""
          if [ -z "$dir" ]; then
            # GitHub tidak mengekstrak zip. Pakai zip proyek yang terakhir di-commit.
            git fetch --unshallow --quiet 2>/dev/null || true
            newest=-1
            while IFS= read -r z; do
              isi=$(unzip -l "$z" 2>/dev/null || true)
              case "$isi" in *pubspec.yaml*) ;; *) continue ;; esac
              t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
              if [ "${t:-0}" -ge "$newest" ]; then newest=${t:-0}; zip=$z; fi
            done < <(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | sort)
            if [ -n "$zip" ]; then
              mkdir .proyek-zip
              unzip -q "$zip" -d .proyek-zip || { echo "::error::Gagal membuka $zip. Unggah ulang zipnya."; exit 1; }
              dir=$(find_project .proyek-zip) || dir=""
            fi
          fi
          if [ -z "$dir" ]; then
            echo "::error::Proyek QELVO (pubspec.yaml dengan name: qelvo_ai) tidak ada di repo ini, baik sebagai folder maupun di dalam .zip. Unggah zip proyek ke akar repo, atau unggah isinya supaya .github, app, dan backend berada di akar repo."
            echo "Isi repo yang terlihat oleh workflow:"
            find . -maxdepth 2 -not -path './.git' -not -path './.git/*' -not -path './.proyek-zip*' | sort | head -60
            exit 1
          fi
          if [ -n "$zip" ]; then
            echo "::notice::Proyek diambil dari $zip karena GitHub tidak mengekstrak zip. Workflow di dalam zip tidak berlaku; yang berjalan adalah .github/workflows di repo ini."
          else
            echo "::warning::Proyek ada di '$dir', bukan di app/. Build tetap jalan, tapi sebaiknya pindahkan isinya supaya .github, app, dan backend berada di akar repo."
          fi
          if [ "$dir" = "." ]; then
            mkdir app.tmp
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name app.tmp -exec mv {} app.tmp/ \;
            mv app.tmp app
          else
            [ -e app ] && mv app app.asli
            mv "$dir" app
          fi

      # Nilai Firebase boleh diambil dari app/google-services.json. Variable
      # yang sudah terisi tetap diutamakan.
      - name: Baca google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "app/google-services.json tidak ada; nilai Firebase hanya dari Variables."
            exit 0
          fi
          client='.client[] | select(.client_info.android_client_info.package_name == "com.qelvo.qelvo_ai")'
          jq -e "$client" google-services.json > /dev/null \
            || echo "::warning::google-services.json tidak memuat aplikasi com.qelvo.qelvo_ai. Periksa nama paket di Firebase."
          fill() {
            [ -n "${!1}" ] && return 0
            value=$(jq -r "$2 // empty" google-services.json)
            if [ -n "$value" ]; then
              echo "$1=$value" >> "$GITHUB_ENV"
              echo "Diambil dari google-services.json: $1"
            fi
            return 0
          }
          fill FIREBASE_API_KEY "$client | .api_key[0].current_key"
          fill FIREBASE_APP_ID "$client | .client_info.mobilesdk_app_id"
          fill FIREBASE_PROJECT_ID ".project_info.project_id"
          fill FIREBASE_SENDER_ID ".project_info.project_number"
          fill FIREBASE_STORAGE_BUCKET ".project_info.storage_bucket"

      # Gagal lebih awal dengan pesan jelas, daripada menghasilkan APK yang
      # hanya menampilkan layar "Firebase belum disiapkan".
      - name: Periksa konfigurasi
        run: |
          missing=""
          found=""
          for name in QELVO_API_URL FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID FIREBASE_SENDER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else found="$found $name"; fi
          done
          echo "Terbaca:${found:- (tidak ada)}"
          if [ -n "$missing" ]; then
            echo "::error::Belum terbaca:$missing. Isi di Settings > Secrets and variables > Actions (tab Actions, bukan Codespaces atau Dependabot) > Variables > Repository variables, dengan nama persis sama. Nilai Firebase juga bisa diambil dari app/google-services.json. Panduan: docs/ENV.md"
            exit 1
          fi
          case "$QELVO_API_URL" in
            https://*) ;;
            http://*) echo "::warning::QELVO_API_URL memakai http://. Cocok untuk uji coba, bukan untuk pemakaian sungguhan." ;;
            *) echo "::error::QELVO_API_URL harus diawali https:// atau http://"; exit 1 ;;
          esac
          case "$FIREBASE_SENDER_ID" in
            ''|*[!0-9]*) echo "::error::FIREBASE_SENDER_ID harus berupa angka (project_number di google-services.json)."; exit 1 ;;
          esac
          case "$FIREBASE_APP_ID" in
            1:*:android:*) ;;
            *) echo "::warning::FIREBASE_APP_ID biasanya berbentuk 1:123456789012:android:abcdef. Pastikan itu ID aplikasi Android, bukan web atau iOS." ;;
          esac
          case "$FIREBASE_API_KEY" in
            AIza*) ;;
            *) echo "::warning::FIREBASE_API_KEY biasanya diawali AIza. Periksa lagi nilainya." ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      # Login Google mencocokkan sidik jari (SHA-1) tanda tangan APK dengan yang
      # terdaftar di Firebase. Tanpa keystore tetap, sidik jari berubah tiap build.
      - name: Pasang keystore debug yang tetap
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              echo "::error::DEBUG_KEYSTORE_BASE64 rusak atau terpotong. Jalankan ulang workflow 'Buat keystore debug' dan salin seluruh teksnya."
              exit 1
            fi
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diisi. SHA-1 APK berubah di tiap build, jadi login Google bisa gagal. Login tamu tetap jalan."
          fi

      - name: Tulis env.json
        run: |
          jq -n \
            --arg url "$QELVO_API_URL" \
            --arg key "$FIREBASE_API_KEY" \
            --arg app "$FIREBASE_APP_ID" \
            --arg project "$FIREBASE_PROJECT_ID" \
            --arg sender "$FIREBASE_SENDER_ID" \
            --arg bucket "$FIREBASE_STORAGE_BUCKET" \
            --arg email "$EMAIL_LOGIN" \
            '{QELVO_API_URL: $url, FIREBASE_API_KEY: $key, FIREBASE_APP_ID: $app, FIREBASE_PROJECT_ID: $project, FIREBASE_SENDER_ID: $sender, FIREBASE_STORAGE_BUCKET: $bucket, EMAIL_LOGIN: $email}' > env.json

      - name: Siapkan proyek Android
        run: bash tool/setup_android.sh

      - name: Analisis kode
        run: flutter analyze
        continue-on-error: true

      - name: Tes
        run: flutter test
        continue-on-error: true

      - name: Build APK
        env:
          ABI: ${{ inputs.abi }}
        run: |
          flags="--release --dart-define-from-file=env.json"
          if [ "$ABI" = "arm64" ]; then
            flags="$flags --target-platform android-arm64"
          fi
          flutter build apk $flags

      - name: Beri nama berkas APK
        id: apk
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          name="QELVO-v${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Ringkasan
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          ABI: ${{ inputs.abi }}
        run: |
          apk="build/$APK_NAME"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          {
            echo "## QELVO APK"
            echo
            echo "- Berkas: \`$APK_NAME\` ($(du -h "$apk" | cut -f1), ${ABI:-universal})"
            echo "- SHA-256 berkas: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            if [ -n "$signer" ]; then
              echo "- Sidik jari tanda tangan APK (harus sama dengan yang didaftarkan di Firebase):"
              echo '```'
              "$signer" verify --print-certs "$apk" | grep -E 'SHA-(1|256) digest' || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: qelvo-apk
          path: app/build/${{ steps.apk.outputs.name }}
          retention-days: 14

      # Release memudahkan unduh dari HP: satu tautan langsung ke APK,
      # tanpa membuka zip artifact.
      - name: Buat GitHub Release
        if: ${{ inputs.release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            extra=()
          else
            tag="build-$GITHUB_RUN_NUMBER"
            extra=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" "build/$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "QELVO $tag" \
            --notes "APK uji coba, ditandatangani kunci debug. Aktifkan 'Instal dari sumber tidak dikenal' untuk memasangnya." \
            --prerelease \
            "${extra[@]}"
          echo "- Rilis: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
