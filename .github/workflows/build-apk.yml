name: Build QELVO AI APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: qelvo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}

      - name: Restore stable debug keystore (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Keystore debug tetap berhasil dipasang."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diisi. APK tetap dicoba dibuat, tetapi login Google mungkin belum berfungsi sampai fingerprint Firebase cocok."
          fi

      - name: Create build configuration
        env:
          QELVO_API_URL: ${{ vars.QELVO_API_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg url "${QELVO_API_URL:-}" \
            --arg key "${FIREBASE_API_KEY:-}" \
            --arg app "${FIREBASE_APP_ID:-}" \
            --arg project "${FIREBASE_PROJECT_ID:-}" \
            --arg sender "${FIREBASE_SENDER_ID:-}" \
            --arg bucket "${FIREBASE_STORAGE_BUCKET:-}" \
            '{QELVO_API_URL:$url, FIREBASE_API_KEY:$key, FIREBASE_APP_ID:$app, FIREBASE_PROJECT_ID:$project, FIREBASE_SENDER_ID:$sender, FIREBASE_STORAGE_BUCKET:$bucket}' > env.json

          if [[ -z "${QELVO_API_URL:-}" ]]; then
            echo "::warning::Repository Variable QELVO_API_URL kosong. Aplikasi tidak akan bisa terhubung ke backend produksi sampai alamat server diatur."
          fi
          if [[ -z "${FIREBASE_API_KEY:-}" || -z "${FIREBASE_APP_ID:-}" || -z "${FIREBASE_PROJECT_ID:-}" || -z "${FIREBASE_SENDER_ID:-}" ]]; then
            echo "::warning::Konfigurasi Firebase belum lengkap. APK dapat dibangun, tetapi login dan fitur Firestore tidak akan siap dipakai."
          fi

      - name: Generate Android project and launcher icons
        run: bash tool/setup_android.sh

      - name: Analyze Dart code
        id: analyze
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        id: tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qelvo-ai-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## QELVO AI — Android build"
            echo
            echo "- Build job: **${JOB_STATUS}**"
            echo "- Flutter analyze: **${ANALYZE_OUTCOME:-not run}**"
            echo "- Flutter tests: **${TEST_OUTCOME:-not run}**"
            echo "- Jika build berhasil, unduh \`qelvo-ai-android-apk\` dari bagian Artifacts pada halaman run ini."
            echo
            echo "Catatan: APK ini untuk pengujian. Pastikan backend HTTPS dan konfigurasi Firebase sudah benar sebelum membagikan aplikasi."
          } >> "$GITHUB_STEP_SUMMARY"
